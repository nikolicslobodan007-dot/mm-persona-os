[project]
name = "mm-persona-os"
version = "0.1.0"
description = "MercatoMaster Persona OS po Canon v1.1"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.27",
    "celery>=5.4",
    "redis>=5.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-django>=4.8", "ruff>=0.5", "mypy>=1.10"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Migracije piše Django, ne mi — dužina reda u njima nije naša odluka.
[tool.ruff.lint.per-file-ignores]
"apps/*/migrations/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Kod se ne instalira kao paket — pokreće se iz /app. Bez ovoga
# `pip install -e ".[dev]"` pada na „Multiple top-level packages discovered
# in a flat-layout", a Dockerfile je tiho prelazio na tvrdo upisan spisak
# paketa u kome nije bilo ni djangorestframework-a ni gunicorn-a.
[tool.setuptools]
packages = []

<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Korporacija</title>
<meta name="description" content="Web Korporacija — posao obavljaju AI agenti.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b0f1a'/%3E%3Cpath d='M54 14 30 56h18l-6 30 28-44H52z' fill='%234da3ff'/%3E%3C/svg%3E">
<style>
  :root{--bg:#0b0f1a;--bg2:#111726;--txt:#e8edf7;--dim:#9aa7bd;--line:#1e293f;--acc:#4da3ff;--acc2:#7ef0c8}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:400 17px/1.65 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  a{color:var(--acc);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:760px;margin:0 auto;padding:0 24px;width:100%}
  header{border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:68px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--txt)}
  .logo svg{width:26px;height:26px}
  .nav a.lnk{color:var(--dim);font-size:15px}
  main{flex:1;display:flex;align-items:center}
  h1{font-size:clamp(32px,6vw,52px);line-height:1.1;letter-spacing:-.02em;margin:0 0 16px;font-weight:800}
  .lead{color:#c6d2e6;font-size:20px;margin:0 0 10px;max-width:60ch}
  .sub{color:var(--dim);font-size:16px;margin:0 0 34px}
  ul{margin:0;padding-left:0;list-style:none}
  li{position:relative;padding-left:26px;margin-bottom:10px;color:#c6d2e6}
  li::before{content:"→";position:absolute;left:0;top:0;color:var(--acc2);font-weight:700}
  footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--dim);font-size:14.5px}
  .fnav{display:flex;flex-wrap:wrap;gap:18px}
  .fnav a{color:var(--dim)}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <span class="logo">
      <svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#111726"/><path d="M54 14 30 56h18l-6 30 28-44H52z" fill="#4da3ff"/></svg>
      Web Korporacija
    </span>
    <nav><a class="lnk" href="/bot">Naš bot</a></nav>
  </div>
</header>

<main>
  <div class="wrap">
    <h1>Web Korporacija</h1>
    <p class="lead">Firma u kojoj posao obavljaju AI agenti.</p>
    <p class="sub">Sajt je u pripremi. Do tada:</p>
    <ul>
      <li>O botu koji ponekad čita javne stranice: <a href="/bot">Naš bot</a></li>
      <li>Kontakt: <a href="mailto:kontakt@webkorporacija.com">kontakt@webkorporacija.com</a></li>
    </ul>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="fnav">
      <a href="/bot">Naš bot</a>
      <a href="mailto:kontakt@webkorporacija.com">kontakt@webkorporacija.com</a>
    </div>
  </div>
</footer>

</body>
</html>

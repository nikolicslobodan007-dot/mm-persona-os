# Razvojno okruženje — Canon v1.1 §20 tačka 6.
services:

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: persona_os
      POSTGRES_USER: persona
      POSTGRES_PASSWORD: persona
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U persona -d persona_os"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: persona
      MINIO_ROOT_PASSWORD: persona123
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file: [.env]
    ports: ["8000:8000"]
    volumes: [".:/app"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  beat:
    build: .
    # Canon §11.1 — beat na 30 s, ne na 5 minuta.
    command: celery -A config.celery beat --loglevel=INFO
    env_file: [.env]
    volumes: [".:/app"]
    depends_on: [redis]

  worker_core:
    build: .
    # Canon §11.3 — domen bira queue, prioritet je atribut poruke.
    command: >
      celery -A config.celery worker --loglevel=INFO
      -Q control,approval,persona.interactive,persona.scheduled,memory,maintenance
      --concurrency=2
    env_file: [.env]
    volumes: [".:/app"]
    depends_on: [redis, postgres]

  worker_browser:
    build: .
    # Canon §12.2 — jedinica je browser kontekst, najviše 4 po worker procesu.
    command: celery -A config.celery worker --loglevel=INFO -Q browser --concurrency=4
    env_file: [.env]
    volumes: [".:/app"]
    depends_on: [redis, postgres]

  worker_channel:
    build: .
    command: celery -A config.celery worker --loglevel=INFO -Q channel,mail,media --concurrency=2
    env_file: [.env]
    volumes: [".:/app"]
    depends_on: [redis, postgres]

volumes:
  pgdata:
  miniodata:

components:
  schemas:
    AssertionInRequest:
      type: object
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 220
        predicate:
          type: string
          minLength: 1
          maxLength: 120
        value: {}
      required:
      - predicate
      - subject
      - value
    BatchInRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProposalInRequest'
          maxItems: 50
          minItems: 1
      required:
      - items
    ContextInRequest:
      type: object
      properties:
        persona_id:
          type: string
          minLength: 1
        run_id:
          type: string
          minLength: 1
        profile:
          $ref: '#/components/schemas/ProfileEnum'
        query:
          type: string
          default: ''
          maxLength: 4000
        max_tokens:
          type: integer
          maximum: 32000
          minimum: 200
      required:
      - persona_id
      - profile
      - run_id
    DecisionEnum:
      enum:
      - APPROVED
      - APPROVED_WITH_CHANGES
      - REJECTED
      type: string
      description: |-
        * `APPROVED` - APPROVED
        * `APPROVED_WITH_CHANGES` - APPROVED_WITH_CHANGES
        * `REJECTED` - REJECTED
    DecisionInRequest:
      type: object
      properties:
        decision:
          $ref: '#/components/schemas/DecisionEnum'
        payload_override:
          type: object
          additionalProperties: {}
        reason:
          type: string
          default: ''
          maxLength: 2000
        decided_by:
          type: string
          minLength: 1
      required:
      - decision
    DisclosureModeEnum:
      enum:
      - ALWAYS_VISIBLE
      - PROFILE_ONLY
      - ON_REQUEST
      type: string
      description: |-
        * `ALWAYS_VISIBLE` - ALWAYS_VISIBLE
        * `PROFILE_ONLY` - PROFILE_ONLY
        * `ON_REQUEST` - ON_REQUEST
    DraftInRequest:
      type: object
      properties:
        persona_id:
          type: string
          minLength: 1
        topic:
          type: string
          default: ''
          maxLength: 220
        angle:
          type: string
          default: ''
          maxLength: 1000
        body:
          type: string
          nullable: true
          minLength: 1
          maxLength: 5000
        format:
          allOf:
          - $ref: '#/components/schemas/FormatEnum'
          default: post
      required:
      - persona_id
    EvaluateInRequest:
      type: object
      properties:
        persona_id:
          type: string
          minLength: 1
        action_type:
          type: string
          minLength: 1
          maxLength: 64
        payload:
          type: object
          additionalProperties: {}
        intent:
          type: string
          default: ''
          maxLength: 2000
        target_ref:
          type: string
          default: ''
          maxLength: 500
        channel_account_id:
          type: string
          format: uuid
          nullable: true
        run_id:
          type: string
          nullable: true
          minLength: 1
        action_id:
          type: string
          minLength: 1
    FormatEnum:
      enum:
      - post
      - article
      - newsletter
      - comment
      - reply
      - video_script
      - thread
      type: string
      description: |-
        * `post` - post
        * `article` - article
        * `newsletter` - newsletter
        * `comment` - comment
        * `reply` - reply
        * `video_script` - video_script
        * `thread` - thread
    KillSwitchInRequest:
      type: object
      properties:
        operation:
          allOf:
          - $ref: '#/components/schemas/OperationEnum'
          default: activate
        scope:
          $ref: '#/components/schemas/ScopeEnum'
        target:
          type: string
          default: ''
          maxLength: 180
        kill_switch_id:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - reason
    LevelEnum:

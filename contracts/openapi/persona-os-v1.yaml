openapi: 3.0.3
info:
  title: MM Persona OS API
  version: 1.0.0
  description: Canon v1.1 §8. Interni API — nije javni.
paths:
  /api/v1/actions/{action_id}:
    get:
      operationId: actions_retrieve
      description: Posle prijave upisuje principala u kontekst i proverava `X-Actor-ID`.
      parameters:
      - in: path
        name: action_id
        schema:
          type: string
        required: true
      tags:
      - actions
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/actions/{action_id}/policy-trace:
    get:
      operationId: actions_policy_trace
      description: 'Ceo lanac jedne akcije: odluke, odobrenja, pokušaji — Canon §16.5.'
      parameters:
      - in: path
        name: action_id
        schema:
          type: string
        required: true
      tags:
      - actions
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/audit:
    get:
      operationId: audit_list
      description: Posle prijave upisuje principala u kontekst i proverava `X-Actor-ID`.
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: event_key
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: persona_id
        schema:
          type: string
      - in: query
        name: since
        schema:
          type: string
        description: ISO-8601 UTC
      - in: query
        name: trace_id
        schema:
          type: string
      tags:
      - audit
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/context/build:
    post:
      operationId: context_build
      description: Posle prijave upisuje principala u kontekst i proverava `X-Actor-ID`.
      tags:
      - context
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextInRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/memories/{memory_id}/supersede:
    post:
      operationId: memories_supersede
      description: Posle prijave upisuje principala u kontekst i proverava `X-Actor-ID`.
      parameters:
      - in: path
        name: memory_id
        schema:
          type: string
        required: true
      tags:
      - memories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupersedeInRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/ops/personas/{public_id}/timeline:
    get:
      operationId: ops_persona_timeline
      description: Posle prijave upisuje principala u kontekst i proverava `X-Actor-ID`.
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: decision
        schema:
          type: string
          enum:
          - ACT
          - DEFER
          - SKIP
      - in: query
        name: limit
        schema:
          type: integer
      - in: path
        name: public_id
        schema:
          type: string
        required: true
      tags:
      - ops
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/personas:
    get:
      operationId: personas_list
      description: Posle prijave upisuje principala u kontekst i proverava `X-Actor-ID`.
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: persona_type
        schema:
          type: string
          enum:
          - AI_CREATOR
          - AI_EXPERT
          - ASSISTANT
          - BRAND_AGENT
          - SIMULATION_ONLY
      - in: query
        name: runtime_environment
        schema:
          type: string
          enum:
          - CONTROLLED_LIVE
          - LIVE
          - SHADOW
          - SIMULATION
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
          - DEGRADED
          - DRAFT
          - PAUSED
          - READY
          - SUSPENDED
      tags:
      - personas
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: personas_create
      description: Posle prijave upisuje principala u kontekst i proverava `X-Actor-ID`.
      tags:
      - personas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaCreateInRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/personas/{public_id}:
    get:
      operationId: personas_retrieve
      description: Posle prijave upisuje principala u kontekst i proverava `X-Actor-ID`.
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
        required: true
      tags:
      - personas
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    patch:
      operationId: personas_partial_update
      description: Posle prijave upisuje principala u kontekst i proverava `X-Actor-ID`.
      parameters:
      - in: header
        name: If-Match
        schema:
          type: string
        required: true
      - in: path
        name: public_id
        schema:
          type: string
        required: true
      tags:
      - personas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPersonaPatchInRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/personas/{public_id}/behaviour/tick:
    post:
      operationId: personas_behaviour_tick
      description: Posle prijave upisuje principala u kontekst i proverava `X-Actor-ID`.
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
        required: true
      tags:
      - personas
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/personas/{public_id}/memories:
    post:
      operationId: memories_create
      description: Posle prijave upisuje principala u kontekst i proverava `X-Actor-ID`.
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
        required: true
      tags:
      - personas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryInRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/personas/{public_id}/memories/query:
    post:
      operationId: memories_query
      description: Posle prijave upisuje principala u kontekst i proverava `X-Actor-ID`.
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
        required: true
      tags:
      - personas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryInRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/personas/{public_id}/snapshot:
    get:
      operationId: personas_snapshot
      description: Posle prijave upisuje principala u kontekst i proverava `X-Actor-ID`.
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
        required: true
      tags:
      - personas
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/personas/{public_id}/wake:
    post:
      operationId: personas_wake
      description: Posle prijave upisuje principala u kontekst i proverava `X-Actor-ID`.
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
        required: true
      tags:
      - personas
      security:
      - tokenAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/runs/{run_id}:
    get:
      operationId: runs_retrieve
      description: Posle prijave upisuje principala u kontekst i proverava `X-Actor-ID`.
      parameters:
      - in: path
        name: run_id
        schema:
          type: string
        required: true
      tags:
      - runs
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    AssertionInRequest:
      type: object
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 220
        predicate:
          type: string
          minLength: 1
          maxLength: 120
        value: {}
      required:
      - predicate
      - subject
      - value
    ContextInRequest:
      type: object
      properties:
        persona_id:
          type: string
          minLength: 1
        run_id:
          type: string
          minLength: 1
        profile:
          $ref: '#/components/schemas/ProfileEnum'
        query:
          type: string
          default: ''
          maxLength: 4000
        max_tokens:
          type: integer
          maximum: 32000
          minimum: 200
      required:
      - persona_id
      - profile
      - run_id
    DisclosureModeEnum:
      enum:
      - ALWAYS_VISIBLE
      - PROFILE_ONLY
      - ON_REQUEST
      type: string
      description: |-
        * `ALWAYS_VISIBLE` - ALWAYS_VISIBLE
        * `PROFILE_ONLY` - PROFILE_ONLY
        * `ON_REQUEST` - ON_REQUEST
    MemoryInRequest:
      type: object
      properties:
        memory_type:
          $ref: '#/components/schemas/MemoryTypeEnum'
        content:
          type: string
          minLength: 1
          maxLength: 8000
        title:
          type: string
          minLength: 1
          default: ''
          maxLength: 220
        salience:
          type: number
          format: double
          maximum: 1
          minimum: 0
          default: 0.6
        confidence:
          type: number
          format: double
          maximum: 1
          minimum: 0
        sensitivity:
          type: number
          format: double
          maximum: 1
          minimum: 0
          default: 0.0
        source_kind:
          allOf:
          - $ref: '#/components/schemas/SourceKindEnum'
          default: first_party_user_input
        provenance:
          allOf:
          - $ref: '#/components/schemas/ProvenanceEnum'
          default: user_provided
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 60
          maxItems: 20
        assertion:
          $ref: '#/components/schemas/AssertionInRequest'
        pinned:
          type: boolean
          default: false
      required:
      - content
      - memory_type
    MemoryTypeEnum:
      enum:
      - working
      - episodic
      - semantic
      - procedural
      - social
      - content
      type: string
      description: |-
        * `working` - working
        * `episodic` - episodic
        * `semantic` - semantic
        * `procedural` - procedural
        * `social` - social
        * `content` - content
    MemoryTypesEnum:
      enum:
      - working
      - episodic
      - semantic
      - procedural
      - social
      - content
      type: string
      description: |-
        * `working` - working
        * `episodic` - episodic
        * `semantic` - semantic
        * `procedural` - procedural
        * `social` - social
        * `content` - content
    PatchedPersonaPatchInRequest:
      type: object
      description: PATCH /api/v1/personas/{public_id}. Samo polja bez sopstvenog toka
        odobrenja.
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 160
        disclosure_mode:
          $ref: '#/components/schemas/DisclosureModeEnum'
        primary_locale:
          type: string
          minLength: 1
          maxLength: 16
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        metadata:
          type: object
          additionalProperties: {}
    PersonaCreateInRequest:
      type: object
      description: |-
        POST /api/v1/personas. Persona uvek nastaje kao DRAFT u SIMULATION, L0.

        Status, okruženje i trust se ovde ne zadaju: aktivacija, prelaz iz
        simulacije i promena poverenja su zasebne radnje sa svojim odobrenjima
        (Canon §3.2, §9.5, §15.2 A3), a ne polja koja se popune pri kreiranju.
      properties:
        public_id:
          type: string
          minLength: 1
          maxLength: 16
        slug:
          type: string
          minLength: 1
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        display_name:
          type: string
          minLength: 1
          maxLength: 160
        persona_type:
          $ref: '#/components/schemas/PersonaTypeEnum'
        disclosure_mode:
          $ref: '#/components/schemas/DisclosureModeEnum'
        disclosure_required:
          type: boolean
          default: true
        primary_locale:
          type: string
          minLength: 1
          maxLength: 16
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        metadata:
          type: object
          additionalProperties: {}
      required:
      - disclosure_mode
      - display_name
      - persona_type
      - primary_locale
      - timezone
    PersonaTypeEnum:
      enum:
      - AI_CREATOR
      - AI_EXPERT
      - BRAND_AGENT
      - ASSISTANT
      - SIMULATION_ONLY
      type: string
      description: |-
        * `AI_CREATOR` - AI_CREATOR
        * `AI_EXPERT` - AI_EXPERT
        * `BRAND_AGENT` - BRAND_AGENT
        * `ASSISTANT` - ASSISTANT
        * `SIMULATION_ONLY` - SIMULATION_ONLY
    ProfileEnum:
      enum:
      - reply_context
      - daily_planner
      - content_creation
      - research
      - reflection
      type: string
      description: |-
        * `reply_context` - reply_context
        * `daily_planner` - daily_planner
        * `content_creation` - content_creation
        * `research` - research
        * `reflection` - reflection
    ProvenanceEnum:
      enum:
      - observed
      - user_provided
      - generated
      - inferred
      type: string
      description: |-
        * `observed` - observed
        * `user_provided` - user_provided
        * `generated` - generated
        * `inferred` - inferred
    QueryInRequest:
      type: object
      properties:
        query:
          type: string
          maxLength: 2000
        profile:
          allOf:
          - $ref: '#/components/schemas/ProfileEnum'
          default: research
        memory_types:
          type: array
          items:
            $ref: '#/components/schemas/MemoryTypesEnum'
        top_k:
          type: integer
          maximum: 100
          minimum: 1
      required:
      - query
    SourceKindEnum:
      enum:
      - system_observation
      - first_party_user_input
      - public_web_source
      - llm_inference
      - synthetic_world_event
      type: string
      description: |-
        * `system_observation` - system_observation
        * `first_party_user_input` - first_party_user_input
        * `public_web_source` - public_web_source
        * `llm_inference` - llm_inference
        * `synthetic_world_event` - synthetic_world_event
    SupersedeInRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 8000
        title:
          type: string
          minLength: 1
          maxLength: 220
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - content
      - reason
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
